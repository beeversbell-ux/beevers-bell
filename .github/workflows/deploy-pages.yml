name: Deploy Beevers + Bell site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract production site
        run: |
          rm -rf _site
          mkdir _site
          unzip -q beevers-bell-production.zip -d _site
          test -f _site/index.html
          test -f _site/.nojekyll

      - name: Apply approved v66 site refinements
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gunzip > /tmp/beevers-v66.patch
          cd _site
          patch -p0 < /tmp/beevers-v66.patch
          test -f index.html
          grep -q 'Then the feedback was described differently.' index.html
          grep -q 'THE ROADMAP' index.html
          grep -q 'HOW IT WAS LATER DESCRIBED' index.html

      - name: Apply v67 targeted content restoration
        shell: bash
        run: |
          cd _site
          patch -p0 < ../patches/v67-content.patch
          test -f index.html
          grep -q 'COUNCIL’S OWN TOILET FRAMEWORK' index.html
          grep -q 'Star Weekly · 19 May 2026' index.html
          grep -q 'The public record does not establish that Beevers has passed that assessment.' index.html

      - name: Overlay current approved site
        shell: bash
        run: |
          cp index.html _site/index.html
          cp robots.txt _site/robots.txt
          cp sitemap.xml _site/sitemap.xml
          test -f _site/index.html
          test -f _site/robots.txt
          test -f _site/sitemap.xml
          grep -q 'HOW TO READ THIS RECORD' _site/index.html
          grep -q 'This website follows the story in three parts.' _site/index.html
          grep -q 'https://beeversbell.com/' _site/robots.txt
          grep -q '<loc>https://beeversbell.com/</loc>' _site/sitemap.xml

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
